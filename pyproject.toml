[project]
name = "reference-company-harness"
version = "0.1.0"
description = "Minimal conforming baseline harness for ClawBank Business Bench."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "eth-account>=0.13",
]

[project.optional-dependencies]
dev = []

[project.scripts]
harness = "harness.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]
