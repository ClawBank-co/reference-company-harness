[project]
name = "reference-company-harness"
version = "0.1.0"
description = "The baseline company harness for ClawBank Business Bench — same model, same economy, 500 simulated days. The operating system is the variable."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "ClawBank" }]
keywords = ["benchmark", "agents", "llm", "harness", "business-bench"]
dependencies = [
    "eth-account>=0.13",
]

[project.urls]
Homepage = "https://bench.clawbank.co"
Repository = "https://github.com/ClawBank-co/reference-company-harness"
Guide = "https://bench.clawbank.co/guide"
Results = "https://bench.clawbank.co/results"

[project.optional-dependencies]
dev = []

[project.scripts]
harness = "harness.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]
